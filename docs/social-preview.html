<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PD Pixel Worlds — sharing artwork</title><meta name="robots" content="noindex"><style>
@font-face{font-family:Oxanium;src:url('./assets/Oxanium.woff2') format('woff2');font-weight:200 800;font-display:block}
:root{--pd-field:#050A0F;--pd-section:#0A1219;--pd-ivory:#EDE8E4;--pd-muted:rgba(237,232,228,.58);--pd-line:rgba(237,232,228,.08);--pd-signal:#30B0D0}
*{box-sizing:border-box}body{margin:0;width:1280px;height:640px;overflow:hidden;background:var(--pd-field);color:var(--pd-ivory);font-family:Oxanium,sans-serif;border-top:4px solid var(--pd-signal)}main{padding:40px 56px}.eyebrow{font-size:15px;letter-spacing:.18em;color:var(--pd-signal);font-weight:600;display:flex;justify-content:space-between}.eyebrow span:last-child{color:var(--pd-muted);letter-spacing:.08em}h1{font-size:76px;line-height:1.05;letter-spacing:-.025em;font-weight:600;margin:24px 0 8px}p{font-size:24px;color:var(--pd-muted);margin:0}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}.realm{min-width:0}.realm img{display:block;width:100%;height:224px;object-fit:cover;image-rendering:pixelated;border:1px solid var(--pd-line)}.realm div{margin-top:12px;font-size:14px;font-weight:500;letter-spacing:.08em}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:28px;border-top:1px solid var(--pd-line);padding-top:20px;font-size:15px;color:var(--pd-muted);letter-spacing:.04em}.bottom b{color:var(--pd-ivory);font-weight:500}
</style></head><body><main><div class="eyebrow"><span>PRODYN / HERMES DESKTOP</span><span>OPEN-SOURCE PIXEL REALMS</span></div><h1>Pixel Worlds</h1><p>A place for every agent. A world you can make your own.</p><div class="gallery"><div class="realm"><img src="./images/office-space-scene.png" alt="Office Space demonstration"><div>OFFICE SPACE</div></div><div class="realm"><img src="./images/kitten-cafe-scene.png" alt="Kitten Café demonstration"><div>KITTEN CAFÉ</div></div><div class="realm"><img src="./images/tng-bridge-scene.png" alt="TNG-inspired bridge demonstration"><div>TNG-INSPIRED BRIDGE</div></div></div><div class="bottom"><b>CREATE · IMPORT · LIVE AGENTS</b><span>Pixel Worlds + PW Agents</span></div></main></body></html>
