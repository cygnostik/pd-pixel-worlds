name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- plugin.js desktop/plugin.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:display
      - run: npm run test:realms
      - run: npm run test:ship
